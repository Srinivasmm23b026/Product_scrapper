name: Scheduled supplier scrape

on:
  schedule:
    - cron: '17 1 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-supplier-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: ${{ matrix.supplier }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - supplier: hyperpure
            location_secret: HYPERPURE_SUPPLIER_LOCATION_ID
            expected_min: 300
          - supplier: lots
            location_secret: LOTS_SUPPLIER_LOCATION_ID
            expected_min: 3000
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DB_USE_NULL_POOL: 'true'
      OBJECT_STORAGE_PROVIDER: supabase
      OBJECT_STORAGE_BUCKET: raw-scrapes
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPPLIER_LOCATION_ID: ${{ secrets[matrix.location_secret] }}
      METRICS_PROVIDER: logs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run supplier worker
        env:
          SUPPLIER: ${{ matrix.supplier }}
          EXPECTED_MIN: ${{ matrix.expected_min }}
        run: python -m procurement_assistant.cloud_worker
