AWSTemplateFormatVersion: '2010-09-09'
Description: Procurement Assistant V1 web workload, scheduled workers, and alarms

Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  PublicSubnets: {Type: 'List<AWS::EC2::Subnet::Id>'}
  TaskSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  ClusterArn: {Type: String}
  ContainerImage: {Type: String, Description: Immutable ECR image URI including digest or unique tag}
  DatabaseEndpoint: {Type: String}
  DatabaseSecretArn: {Type: String}
  SnapshotBucket: {Type: String}
  UserPoolId: {Type: String}
  UserPoolClientId: {Type: String}
  AlertTopicArn: {Type: String}
  AppLogGroup: {Type: String}
  WorkerLogGroup: {Type: String}
  OriginVerifySecret: {Type: String, NoEcho: true, MinLength: 24}
  HyperpureLocationId: {Type: String}
  BigBasketLocationId: {Type: String}
  LotsLocationId: {Type: String}
  DeliveritLocationId: {Type: String}
  HyperpureExpectedMin: {Type: Number, Default: 300}
  BigBasketExpectedMin: {Type: Number, Default: 1}
  LotsExpectedMin: {Type: Number, Default: 3000}
  DeliveritExpectedMin: {Type: Number, Default: 1}

Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public CloudFront origin on HTTP with secret header validation
      VpcId: !Ref VpcId
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}]
      SecurityGroupEgress: [{IpProtocol: -1, CidrIp: 0.0.0.0/0}]
  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnets
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher: {HttpCode: '200'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}
  OriginHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret]}
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: app-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig: {OriginProtocolPolicy: http-only, HTTPPort: 80}
            OriginCustomHeaders: [{HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret}]
        DefaultCacheBehavior:
          TargetOriginId: app-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 413f160d-a8bb-4eca-b7c9-7a66acdd4a50
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref DatabaseSecretArn}]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: WorkerOutputs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 's3:PutObject', Resource: !Sub 'arn:${AWS::Partition}:s3:::${SnapshotBucket}/raw-scrapes/*'}
              - {Effect: Allow, Action: 'cloudwatch:PutMetricData', Resource: '*', Condition: {StringEquals: {'cloudwatch:namespace': ProcurementAssistant/Beta}}}
  AppTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: APP_ENV, Value: production}
            - {Name: AUTH_PROVIDER, Value: cognito}
            - {Name: COOKIE_SECURE, Value: 'true'}
            - {Name: DB_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DB_NAME, Value: procurement}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref UserPoolId}
            - {Name: COGNITO_APP_CLIENT_ID, Value: !Ref UserPoolClientId}
          Secrets:
            - {Name: DB_USER, ValueFrom: !Sub '${DatabaseSecretArn}:username::'}
            - {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref AppLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: app}
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
  AppService:
    Type: AWS::ECS::Service
    DependsOn: OriginHeaderRule
    Properties:
      Cluster: !Ref ClusterArn
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref AppTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers: [{ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}]
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref TaskSecurityGroupId], Subnets: !Ref PublicSubnets}
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: scheduler.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: RunWorkers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecs:RunTask', Resource: '*', Condition: {ArnEquals: {'ecs:cluster': !Ref ClusterArn}}}
              - {Effect: Allow, Action: 'iam:PassRole', Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]}
  HyperpureWorker: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: !GetAtt ExecutionRole.Arn, TaskRoleArn: !GetAtt TaskRole.Arn, ContainerDefinitions: [{Name: worker, Image: !Ref ContainerImage, Essential: true, Command: [python, -m, procurement_assistant.cloud_worker], Environment: [{Name: DB_HOST, Value: !Ref DatabaseEndpoint}, {Name: DB_NAME, Value: procurement}, {Name: OBJECT_STORAGE_PROVIDER, Value: s3}, {Name: METRICS_PROVIDER, Value: cloudwatch}, {Name: RAW_SNAPSHOT_BUCKET, Value: !Ref SnapshotBucket}, {Name: CLOUDWATCH_NAMESPACE, Value: ProcurementAssistant/Beta}, {Name: SUPPLIER, Value: hyperpure}, {Name: SUPPLIER_LOCATION_ID, Value: !Ref HyperpureLocationId}, {Name: EXPECTED_MIN, Value: !Ref HyperpureExpectedMin}], Secrets: [{Name: DB_USER, ValueFrom: !Sub '${DatabaseSecretArn}:username::'}, {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: hyperpure}}}]}}
  BigBasketWorker: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: !GetAtt ExecutionRole.Arn, TaskRoleArn: !GetAtt TaskRole.Arn, ContainerDefinitions: [{Name: worker, Image: !Ref ContainerImage, Essential: true, Command: [python, -m, procurement_assistant.cloud_worker], Environment: [{Name: DB_HOST, Value: !Ref DatabaseEndpoint}, {Name: DB_NAME, Value: procurement}, {Name: OBJECT_STORAGE_PROVIDER, Value: s3}, {Name: METRICS_PROVIDER, Value: cloudwatch}, {Name: RAW_SNAPSHOT_BUCKET, Value: !Ref SnapshotBucket}, {Name: CLOUDWATCH_NAMESPACE, Value: ProcurementAssistant/Beta}, {Name: SUPPLIER, Value: bigbasket}, {Name: SUPPLIER_LOCATION_ID, Value: !Ref BigBasketLocationId}, {Name: EXPECTED_MIN, Value: !Ref BigBasketExpectedMin}], Secrets: [{Name: DB_USER, ValueFrom: !Sub '${DatabaseSecretArn}:username::'}, {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: bigbasket}}}]}}
  LotsWorker: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: !GetAtt ExecutionRole.Arn, TaskRoleArn: !GetAtt TaskRole.Arn, ContainerDefinitions: [{Name: worker, Image: !Ref ContainerImage, Essential: true, Command: [python, -m, procurement_assistant.cloud_worker], Environment: [{Name: DB_HOST, Value: !Ref DatabaseEndpoint}, {Name: DB_NAME, Value: procurement}, {Name: OBJECT_STORAGE_PROVIDER, Value: s3}, {Name: METRICS_PROVIDER, Value: cloudwatch}, {Name: RAW_SNAPSHOT_BUCKET, Value: !Ref SnapshotBucket}, {Name: CLOUDWATCH_NAMESPACE, Value: ProcurementAssistant/Beta}, {Name: SUPPLIER, Value: lots}, {Name: SUPPLIER_LOCATION_ID, Value: !Ref LotsLocationId}, {Name: EXPECTED_MIN, Value: !Ref LotsExpectedMin}], Secrets: [{Name: DB_USER, ValueFrom: !Sub '${DatabaseSecretArn}:username::'}, {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: lots}}}]}}
  DeliveritWorker: {Type: 'AWS::ECS::TaskDefinition', Properties: {RequiresCompatibilities: [FARGATE], NetworkMode: awsvpc, Cpu: '256', Memory: '512', ExecutionRoleArn: !GetAtt ExecutionRole.Arn, TaskRoleArn: !GetAtt TaskRole.Arn, ContainerDefinitions: [{Name: worker, Image: !Ref ContainerImage, Essential: true, Command: [python, -m, procurement_assistant.cloud_worker], Environment: [{Name: DB_HOST, Value: !Ref DatabaseEndpoint}, {Name: DB_NAME, Value: procurement}, {Name: OBJECT_STORAGE_PROVIDER, Value: s3}, {Name: METRICS_PROVIDER, Value: cloudwatch}, {Name: RAW_SNAPSHOT_BUCKET, Value: !Ref SnapshotBucket}, {Name: CLOUDWATCH_NAMESPACE, Value: ProcurementAssistant/Beta}, {Name: SUPPLIER, Value: deliverit}, {Name: SUPPLIER_LOCATION_ID, Value: !Ref DeliveritLocationId}, {Name: EXPECTED_MIN, Value: !Ref DeliveritExpectedMin}], Secrets: [{Name: DB_USER, ValueFrom: !Sub '${DatabaseSecretArn}:username::'}, {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}], LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: deliverit}}}]}}
  HyperpureSchedule: {Type: 'AWS::Scheduler::Schedule', Properties: {ScheduleExpression: 'cron(0 1 * * ? *)', FlexibleTimeWindow: {Mode: 'OFF'}, State: ENABLED, Target: {Arn: !Ref ClusterArn, RoleArn: !GetAtt ScheduleRole.Arn, EcsParameters: {TaskDefinitionArn: !Ref HyperpureWorker, LaunchType: FARGATE, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref TaskSecurityGroupId], Subnets: !Ref PublicSubnets}}}}}}
  BigBasketSchedule: {Type: 'AWS::Scheduler::Schedule', Properties: {ScheduleExpression: 'cron(15 1 * * ? *)', FlexibleTimeWindow: {Mode: 'OFF'}, State: ENABLED, Target: {Arn: !Ref ClusterArn, RoleArn: !GetAtt ScheduleRole.Arn, EcsParameters: {TaskDefinitionArn: !Ref BigBasketWorker, LaunchType: FARGATE, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref TaskSecurityGroupId], Subnets: !Ref PublicSubnets}}}}}}
  LotsSchedule: {Type: 'AWS::Scheduler::Schedule', Properties: {ScheduleExpression: 'cron(30 1 * * ? *)', FlexibleTimeWindow: {Mode: 'OFF'}, State: ENABLED, Target: {Arn: !Ref ClusterArn, RoleArn: !GetAtt ScheduleRole.Arn, EcsParameters: {TaskDefinitionArn: !Ref LotsWorker, LaunchType: FARGATE, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref TaskSecurityGroupId], Subnets: !Ref PublicSubnets}}}}}}
  DeliveritSchedule: {Type: 'AWS::Scheduler::Schedule', Properties: {ScheduleExpression: 'cron(45 1 * * ? *)', FlexibleTimeWindow: {Mode: 'OFF'}, State: ENABLED, Target: {Arn: !Ref ClusterArn, RoleArn: !GetAtt ScheduleRole.Arn, EcsParameters: {TaskDefinitionArn: !Ref DeliveritWorker, LaunchType: FARGATE, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref TaskSecurityGroupId], Subnets: !Ref PublicSubnets}}}}}}
  FailedRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A supplier worker reported a failed, partial, or suspicious-zero run
      Namespace: ProcurementAssistant/Beta
      MetricName: RunFailure
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopicArn]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: 'sns:Publish'
            Resource: !Ref AlertTopicArn
  FailedTaskRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Alert when an application or scraper container exits unsuccessfully
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!Ref ClusterArn]
          lastStatus: [STOPPED]
          containers:
            exitCode: [{anything-but: 0}]
      Targets: [{Id: alert-topic, Arn: !Ref AlertTopicArn}]
  StaleDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No supplier product-count metric arrived for more than one day
      Namespace: ProcurementAssistant/Beta
      MetricName: ObservedProducts
      Statistic: SampleCount
      Period: 86400
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopicArn]
  UnhealthyAppAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Application target is unhealthy or cannot reach its database
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions: [{Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}, {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopicArn]

Outputs:
  ApplicationUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  DistributionId: {Value: !Ref Distribution}
