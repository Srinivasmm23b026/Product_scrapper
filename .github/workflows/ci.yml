name: V1 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procurement_ci
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procurement -d procurement_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://procurement:procurement@127.0.0.1:5432/procurement_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked validation dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Audit tracked secrets and artifacts
        run: python scripts/audit_repository.py
      - name: Lint Python
        run: ruff check .
      - name: Run Python suite
        run: python -m pytest -q
      - name: Apply schema to PostgreSQL
        run: python -m alembic upgrade head
      - name: Validate frontend JavaScript
        run: |
          node --check procurement_assistant/static/app.js
          node --check procurement_assistant/static/auth.js
          node --check procurement_assistant/static/sw.js
      - name: Validate infrastructure and configuration
        run: |
          cfn-lint infrastructure/aws/foundation.yaml infrastructure/aws/workload.yaml
          bash -n scripts/deploy_supabase_database.sh
          python - <<'PY'
          import pathlib
          import tomllib
          import yaml

          yaml.safe_load(pathlib.Path("render.yaml").read_text())
          yaml.safe_load(pathlib.Path(".github/workflows/ci.yml").read_text())
          yaml.safe_load(pathlib.Path(".github/workflows/scheduled-scrape.yml").read_text())
          tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          PY
      - name: Verify dependency integrity
        run: python -m pip check
      - name: Build deployable container
        run: docker build --tag procurement-assistant:${{ github.sha }} .
