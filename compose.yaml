services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - procurement-postgres:/var/lib/postgresql/data

volumes:
  procurement-postgres:

