[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-assistant"
version = "0.1.0"
description = "Restaurant procurement assistant and supplier data pipeline"
requires-python = ">=3.11,<3.15"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
py-modules = ["canonicalize", "config", "db", "main"]

[tool.setuptools.packages.find]
include = ["scrapers*"]
