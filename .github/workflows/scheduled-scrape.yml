name: Scheduled supplier scrape

on:
  schedule:
    - cron: '17 1 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-supplier-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: ${{ matrix.supplier }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - supplier: hyperpure
            location_secret: HYPERPURE_SUPPLIER_LOCATION_ID
            expected_min: 300
            optional_location: true
          - supplier: lots
            location_secret: LOTS_SUPPLIER_LOCATION_ID
            # A complete live crawl returned 2,949 unique products. This
            # threshold detects a catalogue loss greater than five percent.
            expected_min: 2800
            optional_location: false
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DB_USE_NULL_POOL: 'true'
      OBJECT_STORAGE_PROVIDER: supabase
      OBJECT_STORAGE_BUCKET: raw-scrapes
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPPLIER_LOCATION_ID: ${{ secrets[matrix.location_secret] }}
      METRICS_PROVIDER: logs
      HYPERPURE_SESSION_STORAGE_PROVIDER: supabase
      HYPERPURE_SESSION_BUCKET: raw-scrapes
      HYPERPURE_SESSION_ENCRYPTION_KEY: ${{ matrix.supplier == 'hyperpure' && secrets.HYPERPURE_SESSION_ENCRYPTION_KEY || '' }}
    steps:
      - name: Skip Hyperpure without a verified location
        if: ${{ matrix.optional_location && env.SUPPLIER_LOCATION_ID == '' }}
        run: 'echo "::notice::Skipping Hyperpure: no verified Hyperpure supplier location is configured."'
      - uses: actions/checkout@v5
        if: ${{ !(matrix.optional_location && env.SUPPLIER_LOCATION_ID == '') }}
      - uses: actions/setup-python@v6
        if: ${{ !(matrix.optional_location && env.SUPPLIER_LOCATION_ID == '') }}
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked runtime dependencies
        if: ${{ !(matrix.optional_location && env.SUPPLIER_LOCATION_ID == '') }}
        run: python -m pip install --requirement requirements.txt --constraint requirements.lock
      - name: Run supplier worker
        id: scrape
        if: ${{ !(matrix.optional_location && env.SUPPLIER_LOCATION_ID == '') }}
        env:
          SUPPLIER: ${{ matrix.supplier }}
          EXPECTED_MIN: ${{ matrix.expected_min }}
        run: timeout --signal=TERM --kill-after=30s 25m python -m procurement_assistant.cloud_worker
      - name: Explain Hyperpure authentication states
        if: ${{ matrix.supplier == 'hyperpure' && always() && env.SUPPLIER_LOCATION_ID != '' }}
        env:
          AUTHENTICATION_STATUS: ${{ steps.scrape.outputs.authentication_status || 'failed' }}
        run: |
          {
            echo '### Hyperpure authentication'
            echo "Status: \`$AUTHENTICATION_STATUS\`"
            echo 'A reauthentication-required run exits gracefully and preserves prior offer freshness.'
          } >> "$GITHUB_STEP_SUMMARY"
