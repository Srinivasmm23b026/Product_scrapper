{% extends "base.html" %}
{% block scripts %}<script defer src="/static/auth.js"></script>{% endblock %}
{% block content %}
<section class="auth-card panel"><p class="eyebrow">Restaurant beta</p><h1>Welcome back</h1><p>Sign in to compare procurement offers and track actual purchases.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="12" autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button><p id="login-error" class="error" role="alert"></p></form><details><summary>Create an account</summary><form id="signup-form"><label>Email<input id="signup-email" type="email" required></label><label>Password<input id="signup-password" type="password" minlength="12" required></label><button class="secondary" type="submit">Send verification code</button></form><form id="confirm-form"><label>Verification code<input id="confirm-code" required></label><button class="secondary" type="submit">Verify email</button></form></details><details><summary>Forgot password?</summary><form id="forgot-form"><label>Email<input id="forgot-email" type="email" required></label><button class="secondary" type="submit">Send reset code</button></form><form id="reset-form"><label>Reset code<input id="reset-code" required></label><label>New password<input id="reset-password" type="password" minlength="12" required></label><button class="secondary" type="submit">Reset password</button></form></details></section>
{% endblock %}
