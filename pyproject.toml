[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-assistant"
version = "0.1.0"
description = "Restaurant procurement assistant and supplier data pipeline"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.12,<5",
    "boto3>=1.43,<2",
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "lxml>=5.2,<7",
    "mangum>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.12,<3",
    "PyJWT[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "requests>=2.31,<3",
    "SQLAlchemy>=2.0,<2.1",
    "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]
infra = ["cfn-lint>=1.55,<2"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
py-modules = ["canonicalize", "config", "db", "main"]

[tool.setuptools.packages.find]
include = ["procurement_assistant*", "scrapers*"]

[tool.setuptools.package-data]
procurement_assistant = ["templates/*.html", "static/*"]
